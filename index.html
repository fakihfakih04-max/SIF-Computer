<body>
<div id="login" class="login">
<div class="login-card"><div class="mark" style="text-align:center">SIF</div><h1 style="text-align:center">SIF Mobile & Computer</h1><p style="text-align:center">Sales • Repair • Accessories • Services</p>
<label>Username</label><input id="u" value="admin"><label>Password</label><input id="p" type="password" value="admin">
<button class="btn primary" style="width:100%;margin-top:18px" onclick="login()">Sign In</button><p id="err" style="color:var(--red);text-align:center;margin-top:10px"></p></div></div>

<main class="main"><header class="top"><button class="btn light hamb" onclick="side.classList.toggle('open')">☰</button><div class="search">⌕ <input placeholder="Search product, IMEI, customer..."></div><div class="user"><div class="avatar">A</div><div><b>Admin</b><small>Administrator</small></div><button class="btn light" onclick="logout()">Logout</button></div></header>
<section class="content" id="content"></section></main></div>

<script>
const $=id=>document.getElementById(id), API="/api";
const contentEl=document.getElementById("content");
let demo=true, productsData=[], customersData=[];

async function login(){
  err.textContent="Signing in...";
  const username=u.value.trim(), password=p.value;

  try{
    const r=await fetch("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok){
      sessionStorage.setItem("sifUser",JSON.stringify(d.user));
      openSIF();
      return;
    }
    if(r.status===401){
      err.textContent=d.detail||"Invalid username or password.";
      return;
    }
  }catch(e){
    // Server unavailable: local fallback demo mode
  }

  if(username==="admin" && password==="admin"){
    sessionStorage.setItem("sifUser",JSON.stringify({username:"admin",role:"admin",offline:true}));
    openSIF();
  }else{
    err.textContent="Invalid username or password.";
  }
}

function openSIF(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  if(typeof dashboard==="function") dashboard();
}
function logout(){location.reload()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");page(b.dataset.page);side.classList.remove("open")});
function page(p){({dashboard,products:liveProductsPage,barcodes:barcodeCenterPage,pos:livePOSPage,mobile:()=>catalogPage('Mobile Phones','Mobile Phones','Phones with photo, price, barcode and stock.'),computers:()=>catalogPage('Computers','Computers & Laptops','Laptops and computers with photo, price, barcode and stock.'),accessories:()=>catalogPage('Accessories','Accessories','Accessories with photo, price, barcode and stock.'),repairs,customers,suppliers,purchases,sales,expenses,stock:stockLivePage,reports,users,settings}[p]||dashboard)()}
function head(t,s,btn=""){return `<div class="head"><div><h1>${t}</h1><p>${s}</p></div>${btn}</div>`}

let settingsCache={usd_lbp:89500,vat_rate:11,vat_enabled:'true',company_name:'SIF Mobile & Computer',invoice_prefix:'INV-'};
async function loadSettings(){try{settingsCache=Object.assign(settingsCache,await apiJSON('/api/settings'))}catch(e){} return settingsCache}
function moneyDual(usd){const u=Number(usd||0), r=Number(settingsCache.usd_lbp||89500);return `<div class="money-row"><span class="money">$${u.toFixed(2)}</span><span class="money">${Math.round(u*r).toLocaleString()} LBP</span></div>`}
function openModal(title,body,actions=''){const old=document.getElementById('globalModal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="globalModal"><div class="modal-box"><div class="title"><b>${title}</b><button class="btn light" onclick="globalModal.remove()">Close</button></div>${body}<div class="form-actions">${actions}</div></div></div>`)}
function esc2(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

async function apiJSON(url, options={}){
  try{
    const r=await fetch(url, options);
    if(!r.ok) throw new Error("404 Offline");
    return await r.json();
  }catch(e){
    throw new Error("404 Offline");
  }
}

async function dashboard(){
  await loadSettings();
  contentEl.innerHTML=head("Dashboard","Real-time overview of your SIF Mobile & Computer business.",`<button class="btn light" onclick="dashboard()">↻ Refresh</button> <button class="btn primary" onclick="page('pos')">＋ New Sale</button>`)+`
  <div id="dashRoot"><div class="card dash-empty">Loading dashboard...</div></div>`;
  
  try{
    const d=await apiJSON('/api/dashboard');
    const t=d.totals||{}, today=d.today||{};
    const series=d.sales_7_days||[];
    const max=Math.max(1,...series.map(x=>Number(x.total||0)));
    const chart=series.map(x=>{const h=Math.max(2,(Number(x.total||0)/max)*100);const dt=new Date(x.date+'T00:00:00');const day=dt.toLocaleDateString(undefined,{weekday:'short'});return `<div class="dash-chart-col"><div class="dash-bar-wrap"><div class="dash-bar" style="height:${h}%" title="${esc2(x.date)} — $${Number(x.total||0).toFixed(2)}"><em>$${Number(x.total||0).toFixed(0)}</em></div></div><div class="dash-day">${day}</div></div>`}).join('');
    
    document.getElementById('dashRoot').innerHTML=`
      <div class="dashboard-kpis">
        <div class="card dash-kpi"><small>Today's Sales</small><div class="kpi-value">$${Number(today.sales||0).toFixed(2)}</div><div class="kpi-sub">${today.sales_count||0} invoices today</div><div class="kpi-icon">↗</div></div>
        <div class="card dash-kpi"><small>Today's Purchases</small><div class="kpi-value">$${Number(today.purchases||0).toFixed(2)}</div><div class="kpi-sub">${today.purchases_count||0} purchases today</div><div class="kpi-icon">↙</div></div>
        <div class="card dash-kpi"><small>Today's Expenses</small><div class="kpi-value">$${Number(today.expenses||0).toFixed(2)}</div><div class="kpi-sub">${today.expenses_count||0} expenses today</div><div class="kpi-icon">−</div></div>
        <div class="card dash-kpi"><small>Customer Receivables</small><div class="kpi-value">$${Number(t.customer_receivables||0).toFixed(2)}</div><div class="kpi-sub">Outstanding customer balance</div><div class="kpi-icon">♙</div></div>
      </div>`;
  }catch(e){
    // Demo mode fallback to prevent 404 error display on GitHub Pages
    renderDemoDashboard();
  }
}

function renderDemoDashboard(){
  document.getElementById('dashRoot').innerHTML=`
    <div class="dashboard-kpis">
      <div class="card dash-kpi"><small>Today's Sales</small><div class="kpi-value">$1,250.00</div><div class="kpi-sub">5 invoices today</div><div class="kpi-icon">↗</div></div>
      <div class="card dash-kpi"><small>Total Products</small><div class="kpi-value">128</div><div class="kpi-sub">Active items</div><div class="kpi-icon">◈</div></div>
      <div class="card dash-kpi"><small>Low Stock</small><div class="kpi-value orange">3</div><div class="kpi-sub">Items need reorder</div><div class="kpi-icon">!</div></div>
      <div class="card dash-kpi"><small>System Status</small><div class="kpi-value green" style="font-size:18px">Online (GitHub)</div><div class="kpi-sub">Demo Mode Active</div><div class="kpi-icon">✓</div></div>
    </div>

function renderPOSProducts(){
  const el=document.getElementById("posProducts"); if(!el)return;
  const q=(document.getElementById("posSearch")?.value||"").toLowerCase();
  const rows=liveProducts.filter(p=>`${p.name} ${p.sku} ${p.barcode||""}`.toLowerCase().includes(q));
  el.innerHTML=rows.map(p=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:12px">
    <div><b>${p.name}</b><div class="muted">${p.sku} • Stock: ${p.quantity}</div></div>
    <button class="btn primary" onclick="addToCart(${p.id})">$${Number(p.sale_price).toFixed(2)} ＋</button>
  </div>`).join("");
}

function addToCart(id){
  const p=liveProducts.find(x=>x.id===id); if(!p)return;
  const existing=cart.find(x=>x.product_id===id);
  if(existing){existing.quantity++;}else cart.push({product_id:id,name:p.name,price:Number(p.sale_price),quantity:1});
  renderCart();
}

function renderCart(){
  const lines=document.getElementById("cartLines"); if(!lines)return;
  let sub=0;
  lines.innerHTML=cart.map((x,i)=>{let t=x.price*x.quantity;sub+=t;return `<div style="padding:9px 0;border-bottom:1px solid var(--border)">
    <b>${x.name}</b><span style="float:right">$${t.toFixed(2)}</span><div class="muted">Qty ${x.quantity}</div></div>`}).join("")||`<div class="empty">Cart is empty.</div>`;
  document.getElementById("cartSub").textContent="$"+sub.toFixed(2);
  document.getElementById("cartTotal").textContent="$"+sub.toFixed(2);
  document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.quantity,0)+" items";
}
